  <text x="64" y="44" font-size="12" font-weight="bold" fill="#4D5156">THE CONTAINER</text>
  <rect x="36" y="64" width="296" height="150" rx="3" fill="#d5e8d4" stroke="#82b366"/>
  <use href="#i-folder" x="54" y="80" width="20" height="20" color="#82b366"/>
  <text x="82" y="96" font-size="13" font-weight="bold" fill="#1A1D21">app/ — we wrote this</text>
  <text x="56" y="124" font-size="11.5" font-family="monospace" fill="#1A1D21">api.py</text>
  <text x="148" y="124" font-size="11.5" fill="#4D5156">the web address</text>
  <text x="56" y="146" font-size="11.5" font-family="monospace" fill="#1A1D21">settings.py</text>
  <text x="148" y="146" font-size="11.5" fill="#4D5156">where the keys go</text>
  <text x="56" y="168" font-size="11.5" font-family="monospace" fill="#1A1D21">index.html</text>
  <text x="148" y="168" font-size="11.5" fill="#4D5156">the chat page</text>
  <text x="56" y="198" font-size="11" fill="#82b366">three files, about 900 lines</text>
  <rect x="356" y="64" width="296" height="150" rx="3" fill="#e1d5e7" stroke="#9673a6"/>
  <use href="#i-folder" x="374" y="80" width="20" height="20" color="#9673a6"/>
  <text x="402" y="96" font-size="13" font-weight="bold" fill="#1A1D21">vendor/ — the students'</text>
  <text x="376" y="124" font-size="11.5" fill="#4D5156">the agent itself</text>
  <text x="376" y="146" font-size="11.5" fill="#4D5156">25 files, built over 11 weeks</text>
  <text x="376" y="168" font-size="11.5" fill="#4D5156">memory, tools, the graph</text>
  <text x="376" y="198" font-size="11" fill="#9673a6">not one line changed</text>
  <rect x="676" y="64" width="288" height="150" rx="3" fill="#fff2cc" stroke="#d6b656"/>
  <use href="#i-disk" x="694" y="80" width="20" height="20" color="#B8860B"/>
  <text x="722" y="96" font-size="13" font-weight="bold" fill="#1A1D21">data/ — written as it runs</text>
  <text x="696" y="124" font-size="11.5" fill="#4D5156">the conversation so far</text>
  <text x="696" y="146" font-size="11.5" fill="#4D5156">which step of a procedure</text>
  <text x="696" y="168" font-size="11.5" fill="#4D5156">what you have told it</text>
  <text x="696" y="198" font-size="11" fill="#B8860B">dies with the container</text>
